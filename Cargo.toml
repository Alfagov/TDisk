[package]
name = "TDisk"
version = "0.1.0"
edition = "2024"

[lib]
name = "tdisk_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
number_prefix = "0.4.0"
ratatui = "0.29.0"
rayon = "1.11.0"
libc = "0.2.177"
unicode-width = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[profile.release]
lto = "thin"
codegen-units = 1
